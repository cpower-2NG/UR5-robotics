# ============================================================================
# 真机规划器参数 —— **模板 / 草稿**，不是现行值。现行值在仓库外。
#
#   安装：cp docs/现场yaml草稿-真机.yaml ~/.config/ur5-vision-grasp/site_real.yaml
#         然后逐项改成**当天实测**的值
#   使用：python3 scripts/board_a1.py --params ~/.config/.../site_real.yaml
#         （或写进站点配置的 planner_params，见 config/site.example.yaml）
#
# 为什么不能照抄当场用：
#   · 外参会漂（俯视相机实测一天 0.945°），必须当天核对后再填 —— 站点配置里
#     强制 `verified` + `ttl_days`，过期即拒；
#   · 串口路径里带**硬件序列号**，属身份信息。本仓是公开副本、一切提交永久公开
#     （AGENTS.md 红线 3），所以这里只留占位符；
#   · `gripper_backend` / `table_scene_enabled` / `ik_group` / `trajectory_action` /
#     `carry_objects` 这 5 个键，走全车入口（`bringup.launch.py`）时**改了不生效、
#     也不报错**。有效值 = 本文件 ⊕ launch 参数，**以 `ros2 param get` 为准**。
# ============================================================================

grasp_planner:
  ros__parameters:
    targets_topic: /targets_3d
    ik_service: /compute_ik
    trajectory_action: /joint_trajectory_controller/follow_joint_trajectory
    base_frame: base_link
    ik_group: ur5_manipulator
    ik_link: tool0
    ik_timeout: 2.0
    arm_joint_names:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    grasp_rpy:
    - 3.141592653589793
    - 0.0
    - 0.0
    home_joints:
    - 0.0
    - -1.57
    - 1.57
    - -1.57
    - -1.57
    - 0.0
    ik_seed:
    - -0.551
    - -0.429
    - 2.045
    - 3.094
    - -1.571
    - -2.122
    tool0_to_fingertip: 0.13
    grasp_clearance: 0.01
    approach_clearance: 0.05
    lift_height: 0.15
    table_min_z: -0.5
    pick_zone:
    - 0.4
    - 0.6
    - 0.0
    - 0.45
    - 0.0
    - 0.0485
    place_slots:
    - 0.45
    - -0.25
    - 0.55
    - -0.25
    - 0.45
    - -0.35
    - 0.55
    - -0.35
    place_z: 0.0285
    place_release_lift: 0.01
    max_attempts_without_place: 10
    idle_finish_timeout: 20.0
    carry_objects: true
    min_score: 0.3
    move_duration: 2.0
    descend_duration: 1.5
    goal_time_tolerance: 2.0
    gripper_duration: 3.0
    close_settle: 0.5
    retry_delay: 0.5
    elbow_guard_enabled: true
    fk_service: /compute_fk
    guard_links:
    - forearm_link
    - wrist_1_link
    table_plane_z: 0.0
    guard_margin: 0.02
    guard_path_samples: 8
    max_joint_jump: 1.0
    table_scene_enabled: false
    table_box_size:
    - 0.8
    - 0.6
    - 0.03
    table_box_pose:
    - 0.6
    - 0.0
    - -0.405
    - 0.0
    - 0.0
    - 0.0
    table_retry_period: 2.0
    gripper_backend: sim
    gripper_none_reason: ''
    sim_gripper_joint: robotiq_85_left_knuckle_joint
    sim_gripper_open: 0.0
    sim_gripper_close: 0.8
    sim_gripper_empty_threshold: 0.75
    sim_gripper_barely_moved: 0.02
    # ⚠️ **模板占位符**，不是现场值。认**符号链接**不认 /dev/ttyUSB0（插拔会变号）。
    #    现行值放仓库外的站点配置（config/site.example.yaml 里那一项），别写回本文件。
    ag95_port: /dev/serial/by-id/usb-<厂商>_<型号>_<序列号>-if00-port0
    ag95_baudrate: 115200
    ag95_slave_id: 1
    ag95_force: 50
    ag95_stroke_mm: 95.0
    ag95_open_mm: 95.0
    ag95_close_mm: 0.0
    ag95_dry_run: false
    ag95_open_is_high: true
