grasp_planner:
  ros__parameters:
    # ⚠️⚠️ 这张表**不是自足的**：下面这 7 项在本文件里写的是**仿真值**，
    #      跑真机时由 `pipeline.launch.py` **无条件覆盖**成真机值
    #      （实测 2026-10-05：那 7 项由 `planner_params` 的第二段 dict 传入，
    #      命令行 -p 优先于 --params-file，所以 yaml 里写什么都不生效）：
    #
    #        ik_group            ur5_manipulator → ur_manipulator
    #        trajectory_action   ..._controller   → scaled_joint_trajectory_controller
    #        tool0_to_fingertip  0.13             → 0.1757   ← 差 45.7 mm！
    #        place_release_lift  0.01             → 0.0156
    #        gripper_backend     sim              → ag95（由命令行给）
    #        carry_objects       true             → 由命令行给
    #        table_scene_enabled false            → 由命令行给
    #
    #      **其余项都从本文件生效**（实测：table_plane_z / pick_zone / place_slots /
    #      place_slot_classes 的节点实读值与本文件逐字一致）。
    #
    #      ⇒ 后果：**不要**绕过 launch 直接
    #        `ros2 run grasp_planner planner_node --params-file 本文件`
    #        那样会读到 0.13 —— 法兰比真机应有的位置**低 45.7 mm**，
    #        放置下降会压到台面；`ik_group` 也会用仿真的名字（IK 全 `INVALID_GROUP_NAME`，
    #        实测 1428/1428）。直跑节点只适合看**路由表/槽位校验**这类不涉及几何的输出。
    targets_topic: /targets_3d
    ik_service: /compute_ik
    trajectory_action: /joint_trajectory_controller/follow_joint_trajectory
    base_frame: base_link
    ik_group: ur5_manipulator
    ik_link: tool0
    ik_timeout: 2.0
    arm_joint_names:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    grasp_rpy:
    - 3.141592653589793
    - 0.0
    - 0.0
    home_joints:
    - 0.0
    - -1.57
    - 1.57
    - -1.57
    - -1.57
    - 0.0
    ik_seed:
    - -0.551
    - -0.429
    - 2.045
    - 3.094
    - -1.571
    - -2.122
    tool0_to_fingertip: 0.13
    grasp_clearance: 0.01
    approach_clearance: 0.05
    lift_height: 0.15
    table_min_z: -0.5
    pick_zone:
    - 0.4
    - 0.6
    - 0.0
    - 0.45
    - 0.0
    - 0.0485
    # ---- A2 分拣：4 色 × 2 格 = 8 格（4 列 × 2 行，**同列同色**）----
    #
    # 布局（base_frame 俯视，x 向前、y 向左）：
    #
    #        y=-0.10   y=-0.20   y=-0.30   y=-0.40     ← 列（每列一个颜色）
    #  x=0.50  红       橙        黄        青
    #  x=0.60  红       橙        黄        青
    #
    # 为什么**沿 y 铺 4 列、沿 x 只铺 2 行**（而不是反着来）：
    #   · 放置带只有 y∈[-0.45,-0.05]（0.40 m）而 x 方向的安全包线是
    #     x∈[0.40,0.75]（0.35 m）—— 两边都够，但 x 若铺 4 列、间距取 0.10 m
    #     的下限，跨度就是 0.30 m，最外一列会顶到包线边界 0.75、几乎没有余量；
    #   · 沿 y 铺 4 列（跨度 0.30 m，居中后两端各留 0.05 m）时，x 只用到
    #     {0.50, 0.60} —— **这两个值正是 A1 真机跑过 4/4 的那两列**，已实测。
    #
    # ✅ 这些数字**已过包线复扫**（2026-10-05，357 格 × 4 个 tool0 高度，
    #    1428 次 IK+FK）：8 格全部落在本行「可用 x 段」内，离最近边界 ≥0.15 m；
    #    撞桌带在 x∈[0.15,0.35] 且 y∈[-0.25,+0.50]（离槽位 x=0.50 还差 0.15 m）、
    #    够不到带在 x∈[0.75,0.95]（离槽位 x=0.60 还差 0.15 m）。
    #    最大全安全矩形 x∈[0.40,0.75] y∈[-0.45,+0.45]，与上一次扫描逐字一致。
    #    ⚠️ 但逐格分类有 **5.3%（19/357）不可复现**（KDL attempts:3、无
    #    consistency_limits ⇒ 随机重启会翻肘分支）⇒ **离边界留一格 0.05 m**。
    #
    # 约束（规划器启动时会自己查，见 `_validate_zones`）：
    #   1. 必须落在 pick_zone **之外** —— 槽位在 y<0，pick_zone 在 y∈[0,0.45] ✓
    #   2. 两两间距 ≥ 夹爪行程 95 mm —— 这里是 100 mm（只是**告警**不是错误，
    #      但 0.10 已经贴着下限，**别再压**）
    place_slots: [
      0.50, -0.10,   0.60, -0.10,     # 红
      0.50, -0.20,   0.60, -0.20,     # 橙
      0.50, -0.30,   0.60, -0.30,     # 黄
      0.50, -0.40,   0.60, -0.40,     # 青
    ]
    # 与 place_slots **逐位对应**：第 i 项 = 第 i 个槽位专属的类别名。
    # 四个名字必须与**权重文件里的类别名逐字相同**（检测器把 model.names
    # 直接塞进 ObjectHypothesis.class_id）。逐字核对的办法：板上跑
    # `live_infer_record.py` 启动时会打印权重自带的类别表，那 7 个名字里
    # 必须有这 4 个。
    #
    # ⚠️ **故意不给 yellowgreen / tan / purple 留槽位。**
    #    这不是遗漏，是保护：实测那一块黄方块会**同时**被框成
    #    `yellow 0.56` 与 `yellowgreen 0.65`，而候选筛选用的是
    #    「按 y 排序、同 y 时**高分在前**」（planner_node.py:1395）⇒
    #    黄绿那个候选**排在前面**。没有黄绿槽位时它被判「无槽位」跳过，
    #    循环落到同一块的 yellow 候选 ⇒ 仍然当黄块抓走，结果是对的；
    #    一旦有了黄绿槽位，这块黄方块就会被**送进黄绿槽**。
    #    换句话说：这一层安全目前**靠「那一类不存在」兜着**，不是靠检测。
    place_slot_classes: [red, red, orange, orange, yellow, yellow, cyan, cyan]
    place_z: 0.0285
    place_release_lift: 0.01
    max_attempts_without_place: 10
    idle_finish_timeout: 20.0
    carry_objects: true
    min_score: 0.3
    move_duration: 2.0
    descend_duration: 1.5
    goal_time_tolerance: 2.0
    gripper_duration: 3.0
    close_settle: 0.5
    retry_delay: 0.5
    elbow_guard_enabled: true
    fk_service: /compute_fk
    guard_links:
    - forearm_link
    - wrist_1_link
    table_plane_z: 0.0
    guard_margin: 0.02
    guard_path_samples: 8
    max_joint_jump: 1.0
    table_scene_enabled: false
    table_box_size:
    - 0.8
    - 0.6
    - 0.03
    table_box_pose:
    - 0.6
    - 0.0
    - -0.405
    - 0.0
    - 0.0
    - 0.0
    table_retry_period: 2.0
    gripper_backend: sim
    gripper_none_reason: ''
    sim_gripper_joint: robotiq_85_left_knuckle_joint
    sim_gripper_open: 0.0
    sim_gripper_close: 0.8
    sim_gripper_empty_threshold: 0.75
    sim_gripper_barely_moved: 0.02
    ag95_port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB0P6UEX-if00-port0
    ag95_baudrate: 115200
    ag95_slave_id: 1
    ag95_force: 50
    ag95_stroke_mm: 95.0
    ag95_open_mm: 95.0
    ag95_close_mm: 0.0
    ag95_dry_run: false
    ag95_open_is_high: true
