# =====================================================================
# **真机现场 yaml —— 草稿（2026-10-03），等审核后再上机**
#
# 用法（它**替换**包内那份，不是叠加 —— launch 里是 parameters=[本文件, 覆盖项]）：
#     ros2 launch yolo_bringup real.launch.py robot_ip:=<控制箱IP> \
#         planner_params_file:=$HOME/site_real.yaml
# ⚠️ 所以本文件必须**完整**：漏掉的键会退回 planner_node 里 declare_parameter 的
#    硬编码默认值（那些是按**仿真**几何写的）。本文件参数集完整（56 项）。
#
# 本次只改了四项，理由逐条写在那几项上面：
#     table_plane_z / pick_zone / place_slots / place_z
#
# ⚠️ 另有几项由 launch 按后端覆盖，**写在本文件里也不生效**：
#     ik_group / trajectory_action / tool0_to_fingertip / place_release_lift
#     / gripper_backend / table_scene_enabled / carry_objects
#
# 生成方式：读包内那份 → 改这四项 → 写出来（不是手抄）。
# =====================================================================

grasp_planner:
  ros__parameters:
    targets_topic: /targets_3d
    ik_service: /compute_ik
    trajectory_action: /joint_trajectory_controller/follow_joint_trajectory
    base_frame: base_link
    ik_group: ur5_manipulator
    ik_link: tool0
    ik_timeout: 2.0
    arm_joint_names:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    grasp_rpy:
    - 3.141592653589793
    - 0.0
    - 0.0
    home_joints:
    - 0.0
    - -1.57
    - 1.57
    - -1.57
    - -1.57
    - 0.0
    ik_seed:
    - -0.551
    - -0.429
    - 2.045
    - 3.094
    - -1.571
    - -2.122
    tool0_to_fingertip: 0.13
    approach_clearance: 0.05
    lift_height: 0.15
    table_min_z: -0.5
    # [xmin,xmax,ymin,ymax,zmin,zmax]
    # 真机抓取区 = 2026-10-03 重扫（负 x 那半边）出来的**最大全安全矩形**
    #   x∈[-0.60,-0.25]  y∈[-0.60,-0.25]（64 格）
    # 本次只取矩形 y 的**下半**当抓取区，上半留给槽位 —— 两半都在那块矩形里。
    # z：检测报的 wz 是**方块顶面** = 台面 0.0 + 方块高 0.0285 = +0.0285
    #    ⇒ z∈[+0.0085,+0.0485]（顶面上下各留 0.02 m，下界已夹到不低于台面）
    # ⚠️ 旧版是 x∈[+0.30,+0.90] —— **扫错了半边**：相机看不到那儿（只覆盖
    #    x∈[-1.18,+0.34]），6 轮数据集 130 块方块也**全部**在 x<0。照旧版填，
    #    检测一条都进不来，而 in_zone 是个静默 continue，**一句日志都没有**。
    # 想改大小/位置：必须仍在 x∈[-0.60,-0.25] y∈[-0.60,-0.25] 之内，且与槽位不重叠。
    pick_zone:
    - -0.6
    - -0.25
    - -0.6
    - -0.44
    - 0.0085
    - 0.0485
    # 扁平 x,y,x,y,...（**不是** [[x,y],...]：ROS 2 没有嵌套数组，写了节点起不来）
    # 两条启动期检查：① 槽位必须在 pick_zone **之外**（硬错误 —— 这就是终止机制本身）
    #                ② 间距 ≥ 夹爪行程（AG-95 95 mm；本组 x 间距 0.14、y 间距 0.12）
    # 四个槽位都落在安全矩形内，且 x ≤ -0.44 ⇒ **避开棋盘格**
    #   （棋盘格在 x∈[-0.33,-0.14] y∈[-0.30,-0.05]，是标定靶、写着 DO NOT TOUCH，
    #    上机前请撤走）。槽位数 4 故意小于能摆的方块数：跑满就走「槽位用尽」收工路径。
    place_slots:
    - -0.58
    - -0.4
    - -0.44
    - -0.4
    - -0.58
    - -0.28
    - -0.44
    - -0.28
    # 放置参考高度 = 台面 + 方块高 = 0.0 + 0.0285 = **+0.0285**（可见顶面，不是中心）。
    # 与抓取段同一约定才严格镜像。仿真那份是 -0.35（台面 -0.39 + 0.04）。
    place_z: 0.0285
    place_release_lift: 0.01
    max_attempts_without_place: 10
    idle_finish_timeout: 20.0
    carry_objects: true
    min_score: 0.3
    move_duration: 2.0
    descend_duration: 1.5
    goal_time_tolerance: 2.0
    gripper_duration: 3.0
    close_settle: 0.5
    retry_delay: 0.5
    elbow_guard_enabled: true
    fk_service: /compute_fk
    guard_links:
    - forearm_link
    - wrist_1_link
    # 真机：臂直接装在工作台桌面上 ⇒ 台面就在 base 的 z≈0（已验：碰台面读 Base z=0）。
    # 仿真那份是 -0.39（「臂坐在 0.80 m 立柱上」的几何）。
    # ⚠️ 这一项填错**不会报错** —— 护栏照着错的平面放行/拦下。
    table_plane_z: 0.0
    guard_margin: 0.02
    guard_path_samples: 8
    max_joint_jump: 1.0
    table_scene_enabled: false
    table_box_size:
    - 0.8
    - 0.6
    - 0.03
    table_box_pose:
    - 0.6
    - 0.0
    - -0.405
    - 0.0
    - 0.0
    - 0.0
    table_retry_period: 2.0
    gripper_backend: sim
    gripper_none_reason: ''
    sim_gripper_joint: robotiq_85_left_knuckle_joint
    sim_gripper_open: 0.0
    sim_gripper_close: 0.8
    sim_gripper_empty_threshold: 0.75
    sim_gripper_barely_moved: 0.02
    ag95_port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB0P6UEX-if00-port0
    ag95_baudrate: 115200
    ag95_slave_id: 1
    ag95_force: 50
    ag95_stroke_mm: 95.0
    ag95_open_mm: 95.0
    ag95_close_mm: 0.0
    ag95_dry_run: true
    ag95_open_is_high: true
