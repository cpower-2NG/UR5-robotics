# grasp_planner 参数。
#
# 这些值原先硬编码在参考项目的 grasp_sim/scripts/grasp_planner.py 里；
# 移植时全部提出来做成参数，因为**真机与仿真的几何完全不同**：
#   仿真：相机 0.5,0,1.145 俯视、UR5 底座在 (-0.1,0,0.80)、桌面 z=0.41
#   真机：底座在工作台上、相机由手眼标定决定、桌面高度实测
# 所以下面凡是几何量，真机上线前都必须按现场实测覆盖。
#
# 用法：
#   ros2 launch grasp_planner planner.launch.py      # 直接跑规划器（需外部提供臂与相机）
#   全车入口是 yolo_bringup/bringup.launch.py：它 include
#   yolo_bringup/pipeline.launch.py，而**本文件正是被 pipeline.launch.py 显式加载**的
#   （D50 —— 在此之前它其实不生效）。arm_grasp_sim/full.launch.py 会再覆写两项：
#   `gripper_backend`（经 camera_source:=sim 派生）与 `table_scene_enabled:=true`。
#
# ⚠️⚠️ **下面有 5 个键在「全车入口」下是死键 —— 改了不生效，而且不报错。**
#
# 原因是 launch 的参数优先级：`pipeline.launch.py` 里那个
#   `planner_params = [ <本文件>, { 覆盖项... } ]`
# 赋值传的是**列表**，而列表里**后面的覆盖前面** —— 下面这 5 个键恰好都在覆盖项里。
# （引用处不写行号：这类引用漂过好几轮，改用「`planner_params =` 那一处」这种锚点。）
#
# | 键 | 全车入口（bringup→pipeline） | 独立入口（planner.launch.py） |
# |---|---|---|
# | `gripper_backend`     | ❌ 死键 | ❌ 死键（那个 launch 的 `parameters=[...]` 也覆盖它） |
# | `table_scene_enabled` | ❌ 死键 | ✅ 生效 |
# | `ik_group`            | ❌ 死键 | ✅ 生效 |
# | `trajectory_action`   | ❌ 死键 | ✅ 生效 |
# | `carry_objects`       | ❌ 死键 | ✅ 生效 |
#
# ⇒ **在全车入口下要改这 5 个，必须走 launch 参数**，例如
#     ros2 launch yolo_bringup bringup.launch.py table_scene_enabled:=true
#   而改本文件会白忙 —— 这是 D50/D64 同一族的病（静默无效）。
#   **之所以不把这 5 个键从本文件删掉**：独立入口下它们（除 `gripper_backend`）
#   是真生效的，删了会让那条路退回节点里的硬编码默认值 —— 那是引入回归。
#
# 下面每个受影响的键旁边都有一行 `⚠️ 死键` 标记，改之前先看这张表。

grasp_planner:
  ros__parameters:
    # ---- 接口 ----
    targets_topic: /targets_3d          # perception_3d 发布的全部候选
    ik_service: /compute_ik             # MoveIt
    # ⚠️ 死键（全车入口下）：真机由 pipeline 覆盖成
    #    /scaled_joint_trajectory_controller/follow_joint_trajectory。改这里无效。
    trajectory_action: /joint_trajectory_controller/follow_joint_trajectory
    base_frame: base_link               # /targets_3d 已在 此帧下
    # ⚠️ 死键（全车入口下）：真机要 ur_manipulator（SRDF 派生名），
    #    由 pipeline 覆盖。改这里无效 —— 这是最容易被踩的一个。
    ik_group: ur5_manipulator
    ik_link: tool0
    ik_timeout: 2.0

    # ---- 机械臂 ----
    arm_joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    # 末端姿态（弧度）：π,0,0 = 工具朝下（参考项目实测可用值）
    grasp_rpy: [3.141592653589793, 0.0, 0.0]

    # 折叠位姿：两次抓取之间回到这里
    home_joints: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]

    # 前伸 IK 种子：**必须固定**。用当前关节角当种子会在回到 HOME 后解出
    # 极端的 shoulder_pan（参考项目实测）。
    ik_seed: [-0.551, -0.429, 2.045, 3.094, -1.571, -2.122]

    # ---- 几何（真机必须按现场实测覆盖）----
    # ⚠️ **参数名骗人**：它的语义是「法兰 → 抓取时该与**方块顶面**重合的那个点」，
    #    即 `tool0_to_fingertip = 闭合时 法兰→指尖 − 方块高`。**含方块高**，
    #    换方块就要重算。仿真（2F-85，方块 40 mm）= 0.170 − 0.040 = 0.13 ✓
    # 真机（AG-95，方块 28.5 mm）应在真机 launch 里覆盖成 **0.1757**
    #    （= 0.2042 − 0.0285；0.2042 含那 4 mm 转接件，取保守侧）。
    #    这里保留仿真值 0.13 —— 真机值由 `pipeline.launch.py` 的
    #    `tool0_to_fingertip` launch 参数随 `camera_source` 自动切换。
    tool0_to_fingertip: 0.13
    approach_clearance: 0.05   # 接近点在抓取高度之上多少（m）
    lift_height: 0.15           # 抓起后抬多高（m）

    # 低于此高度视为「已掉到地上」的物体，跳过。
    # ⚠️ 单位是 **base_frame 的 z**，不是世界系的 z！两者差一个底座高度：
    #   仿真里 UR5 底座在世界系 z=0.80、桌面 0.41 ⇒ base_frame 桌面 ≈ -0.39，
    #   桌上方块实测投影 z ≈ -0.350，地上方块 ≈ -0.78，故取 -0.5 分开两者。
    #   若误填世界系的 0.3，则所有候选都会被丢弃且**不报任何错**。
    # 真机：按现场底座安装高度与桌面高度重新标定这个值。
    #
    # 注意它现在的职责是**纯安全护栏**（挡投影噪声产生的 z≈0/负值）。
    # 决定「谁还能被抓」的是下面的 pick_zone —— 终止机制建立在那上面。
    table_min_z: -0.5

    # ---- 抓取区 / 放置槽位（base_frame 下的 3D 盒子）----
    # pick_zone 格式：[xmin, xmax, ymin, ymax, zmin, zmax]
    # **必须是 3D**：XY 矩形挡不住「滚到地上、但 XY 恰在矩形投影里」的方块，
    # 那会让机械臂收到一条扎向地面的轨迹。
    # 仿真：方块在 base_frame x∈{0.44,0.60,0.76}、y∈{-0.12,0,0.12}、z=-0.37。
    pick_zone: [0.30, 0.90, -0.18, 0.16, -0.45, -0.30]

    # 放置槽位（**按顺序消费**）。
    # ⚠️ 格式是**扁平**的 x,y,x,y,...，**不是** [[x,y],...]：
    #    ROS 2 的参数类型系统没有嵌套数组（rcl_interfaces 只有扁平的
    #    double_array_value）。写成 [[0.44,0.24],...] 会让
    #    `declare_parameter` 直接抛 TypeError、节点**起不来**，
    #    launch 侧按 yaml 规则求值时同样会被拒。
    #    所以「每两个一组」靠约定 + 启动期检查（奇数个值 = 硬错误）。
    # ⚠️ 另两条约束（启动时检查）：
    #   1. **槽位必须落在 pick_zone 之外** —— 否则放下去又被抓起来 = 死循环，
    #      这一条是**硬错误**，启动就会拒绝。**这就是终止机制本身**。
    #   2. 间距 ≥ 夹爪行程（AG-95 为 95 mm）—— 抓取用的是**张开**的爪子，
    #      挨太近会压到相邻槽位里已放好的物体。这一条是**告警**。
    # 下面 6 个 = 2 排 × 3 列，两轴间距 0.16 m。方块有 9 个而槽位只有 6 个
    # 是**故意**的：跑满 6 个就会走到「槽位用尽」收工路径，正好验证它。
    place_slots: [
      0.44,  0.24,   0.60,  0.24,   0.76,  0.24,
      0.44, -0.24,   0.60, -0.24,   0.76, -0.24,
    ]
    # 放置参考高度（base_frame 系）：**与抓取段同一个约定** —— 就是 perception
    # 报的那个点落到槽位上时的 z，即方块静止时**可见顶面**的高度，**不是中心**。
    # 仿真推导：桌面顶面 -0.39 + 方块高 0.04 = **-0.35**。
    #
    # ⚠️ 这里原先写的 -0.37（「中心」）会让夹爪多下 2 cm：指尖插进桌面碰撞体，
    #    六个放置位的下降 IK **全部被拒**（error_code=-31），症状是「能抓不能放」
    #    —— 抓完抬起来，到放置位一解 IK 就失败，只好原地松爪。实测边界（**夹爪张开时**）：
    #    tool0 z=-0.225 可解、-0.230 被拒，而 -0.37 对应 tool0 z=-0.24，正在拒区里。
    #
    # 为什么必须是「顶面」：抓取段的 wz 就是 perception 报的那个点，实测
    #    = 方块顶面（真值中心 -0.37，实测 -0.350，正好差半个方块 —— 俯视的深度
    #    相机看到的是顶面，投影出来的就是顶面中心）。抓取下降 = wz + 指尖偏移，
    #    所以**方块是被夹在顶面高度上的**；放置按同一约定才与抓取严格镜像。
    # 真机：同样按「桌面实测高度 + 方块高」标定（相机也在上方俯视，同一个偏差）。
    #
    # ⚠️ 但**光有 place_z 还不够**，必须再加下面的 place_release_lift。原因见那一条。
    place_z: -0.35

    # 放置下降时在「方块理论落点」之上**额外**留的高度（m）。
    #
    # 为什么非有不可 —— 夹爪**指尖比方块还低**：
    #   · 抓取约定是「指尖夹在方块可见顶面上」，于是**整个方块吊在指尖下方**；
    #   · 2F-85 的指尖几何在**闭合**时比张开时**还低 11.9 mm**（四连杆的副作用，
    #     实测 FK：tool0=-0.22 时指尖连杆原点 张开 -0.3293 / 闭合 -0.3412），
    #     其碰撞网格的最低点恰好与方块底面齐平（碰撞网格是真实 STL，不是外扩包围盒）。
    #   ⇒ 「方块底面正好贴到桌面」这个位置，指尖必然同时压在桌面上 —— 无解。
    #
    # 实测（本机读只探针，槽位 0.44/0.24，桌面顶 -0.39，逐 5 mm 下探）：
    #   夹爪**张开** 0.00：tool0 z=-0.225 可解、-0.230 起被拒（指尖最低 ≈ tool0-0.160）
    #   夹爪**闭合** 0.45：tool0 z=-0.215 可解、-0.220 起被拒（指尖最低 ≈ tool0-0.170）
    # 放置时夹爪是**闭合**的（正夹着方块），所以起作用的是后者：place_z=-0.35
    #   对应的 tool0=-0.220 **正好落在拒区边界上**，症状是六个槽位全被拒、
    #   而抓取段（张开）看起来完全正常 —— 一个只在「手里有东西」时才发作的坑。
    #
    # 所以真正要守的约束不是「方块底面贴桌面」，而是「**指尖最低点高于桌面**」。
    # 10 mm 余量：方块从 10 mm 高处落下，40 mm 的方块在仿真里落稳无碍。
    # 真机：AG-95 的指尖长度与 2F-85 不同，**这个值和 place_z 都要按实物重标**。
    place_release_lift: 0.01

    # 连续多少次尝试都没有产生成功放置 → 判定卡住，收工告警
    max_attempts_without_place: 10

    # 空闲多久**没有发起过任何一次抓取尝试**就收工（s）。
    # 上面那个计数器只在「选中了一个目标」时才加一，兜不住「候选全不可行动」
    # （抓取区已空 / 剩下的都在去重表里 / 分数都低于 min_score）——那时一次
    # 尝试都不会发起，计数永远不动，节点会以检测频率（~10 Hz）无限待命。
    # **这是「抓取区已空」这条收工路径的唯一实现**，也是 demo 能判定「跑完」的依据。
    #
    # ⚠️ 「进展」的判据是**发起过尝试**，不是**收到过检测**。
    #    第一版把它写成「每批检测都重置」，结果被 10 Hz 的检测流彻底架空：
    #    仿真里剩下 1 个方块、它又恰好在去重表里，于是每批都「有候选 → 全被滤掉
    #    → 复位计时器」，日志里 `待命中 0s/20s` 永远停在 0s，收工路径形同不存在。
    #    现在只在「一次尝试开始」与「一次尝试结束」时重置（见 planner_node.py
    #    的 _reset_busy / _select_and_approach）。
    # 真机：Orin 上 YOLO 首次加载可能十几秒，届时把它调大。
    idle_finish_timeout: 20.0

    # false = **只做动作演示**：不闭合夹爪、不判空，臂照样走完
    # 「接近 → 下降 → 抬起 → HOME → 放置位 → 下降 → 抬起 → HOME」。
    # 给「第一个真机 demo」用（AG-95 还没接通，见 RESTRUCTURE_PLAN）。
    # ⚠️ 死键（全车入口下）：由 pipeline 覆盖。改这里无效。
    carry_objects: true

    min_score: 0.3              # 最低置信度

    # ---- 时序 ----
    move_duration: 2.0
    descend_duration: 1.5
    # 轨迹到点后的**宽限时间**（s）：0 是**最严**，不是「关闭检查」。
    # 真机把示教器速度滑条调慢时，time_from_start 是死的、实际走得慢，
    # 每条轨迹都会被判 GOAL_TOLERANCE_VIOLATED。给 1~2 s 宽限。
    goal_time_tolerance: 2.0
    gripper_duration: 3.0
    close_settle: 0.5
    retry_delay: 0.5

    # ---- 姿态安全：肘高护栏（D49）----
    # 「臂装在工作台桌面上」时，**肘朝下**的 IK 解会落到桌面以下约 21 cm，
    # 而 MoveIt 看不到桌子（规划场景里没有碰撞物）⇒ 没有任何一步会拦住它。
    # 护栏用 /compute_fk 查这些连杆的高度：
    # ⚠️ UR5 **没有 elbow_link**，肘关节的子树根就是 forearm_link。
    elbow_guard_enabled: true
    fk_service: /compute_fk
    guard_links: [forearm_link, wrist_1_link]
    # 台面在 base_frame 里的高度。
    # ✅ 真机（2026-10-02 实测）：**≈ 0** —— 臂直接坐在工作台桌面上。
    #    拿 `TCP_1` 指尖碰台面读到 base 系 z = +3.88 mm，其中 4 mm 是
    #    TCP 少填的那层转接件（见 `tool0_to_fingertip`）⇒ 台面 ≈ −0.1 mm。
    #    ⚠️ 读数时示教器位置下拉**必须选「基座」**：默认停在的「视角」
    #    比基座高 399.35 mm，会读出 −395.47 这种假数（RESTRUCTURE_PLAN 第六十六轮）。
    # 仿真 ≈ −0.39（仿真的臂坐在 0.80 m 立柱上，桌面在 0.41 m）。
    # ⇒ 真机上线时**必须覆盖这一个值**，否则护栏按 −0.39 判，等于没有护栏。
    table_plane_z: -0.39
    guard_margin: 0.02          # 余量（m）
    # 整段护栏（B）：上面几条只查**路点本身**，而臂是连续走过去的 ——
    # 两端都在台面之上，中间照样可以俯冲下去。发轨迹前把「当前位置→目标」
    # 的关节空间线段均匀采样这么多段，逐点查一遍。
    #   0 或负数 = 关掉整段检查，退回「只查终点」。
    guard_path_samples: 8
    max_joint_jump: 1.0         # 同一段内相邻路点的最大关节跳变（rad，L∞）

    # ---- 姿态安全：把桌子放进 MoveIt 规划场景 ----
    # 场景里有桌子之后 `avoid_collisions=True` 才名副其实（会拿真实连杆几何
    # 去撞）。默认**关闭**：仿真与真机的桌子不同，一个默认值不可能两边都对，
    # 而**错的碰撞体比没有更坏**（可能把正确解全拒掉，看起来像 IK 坏了）。
    # 仿真侧在 arm_grasp_sim 的 launch 里打开。
    # ⚠️ 真机要开必须走 launch 参数 `... bringup.launch.py table_scene_enabled:=true`，
    #    **改这一行无效**。
    #    🛠 第八十三轮订正了这里的**理由**：原文写「死键（全车入口下）—— yaml 根本
    #       不被加载」。但 D50 修好之后 `pipeline.launch.py:169` **是**加载这份 yaml 的，
    #       所以「不加载」已经不成立。真正的原因是另一条、且仍然成立：
    #       `pipeline.launch.py:478` 把 `table_scene_enabled` 声明成 launch 参数
    #       （默认 `false`）并放进 `planner_params` 的**后一个**字典 ——
    #       同名键后一份赢，所以它盖掉了这里的值。
    #       差别不是文字游戏：按旧理由排查会去查「yaml 加载了吗」（会得到「加载了」，
    #       于是误判成 yaml 写错），按新理由一眼就知道该查 launch 参数。
    table_scene_enabled: false
    table_box_size: [0.8, 0.6, 0.03]
    table_box_pose: [0.6, 0.0, -0.405, 0.0, 0.0, 0.0]
    table_retry_period: 2.0

    # ---- 夹爪 ----
    # sim  = 仿真 Robotiq 2F-85，JTC 的第 7 个关节
    # ag95 = 真机大寰 AG-95，Modbus RTU 独立设备。**已实现**（读/写/到位轮询/
    #        写入生效校验都在 gripper.py），写路径由下面的 ag95_dry_run 卡着。
    #        ⚠️ 今天仍会「构造即报错」，但那是因为**板上还没有 USB-RS485 适配器**
    #        （`_connect()` 打不开串口就抛）—— 不是「尚未实现」。这两件事别混。
    # none = 不驱动夹爪，只配 carry_objects:=false（只走位、不夹持）使用
    # ⚠️ 死键（两个入口都覆盖它：pipeline 与 planner.launch.py 都会覆盖）。
    #    要改必须走 launch 参数 `gripper_backend:=...`。
    gripper_backend: sim
    # 仅 gripper_backend:=none 时有意义：写进启动日志的「为什么没有夹爪」。
    # 真机第一个 demo 由 real.launch.py 覆写成实际情况（AG-95 未接）。
    gripper_none_reason: ""
    sim_gripper_joint: robotiq_85_left_knuckle_joint
    sim_gripper_open: 0.0
    sim_gripper_close: 0.8
    sim_gripper_empty_threshold: 0.75
    sim_gripper_barely_moved: 0.02
    # 用 by-id 而不是 /dev/ttyUSB0：ttyUSB* 的编号**随插拔重新分配**，同机上若
    # 再插第二个 USB 串口设备就会**静默**开错口，症状是「夹爪没反应」——
    # 与 D50/D60 同类。by-id 里的 `AB0P6UEX` 是这颗 **FT232R 的芯片序列号**，
    # 不可克隆（2026-09-30 板端实测：重插后 ttyUSB 号变了，这条软链不变）。
    ag95_port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB0P6UEX-if00-port0
    ag95_baudrate: 115200
    ag95_slave_id: 1
    ag95_force: 50
    ag95_stroke_mm: 95.0
    ag95_open_mm: 95.0
    ag95_close_mm: 0.0
    # ⚠️ 默认**只读**：dry_run=true 时一个寄存器都不写，open/close 只在日志里
    # 说明「本应写什么」。它是**链路验证**模式（接线/从站号/波特率/回读），
    # 不是抓取模式 —— 手指不闭合，规划器每次抓取都会判失败。
    # 翻成 false 的前提：夹爪已从机械臂上拆下、放工作台、急停在手边，
    # 且下面的 ag95_open_is_high 已现场实测确认。
    ag95_dry_run: true
    # 千分位的方向：1000 = 全开（true）还是全闭（false）。
    # ✅ **2026-09-30 板端实测判决，不再是从手册推的**：
    #    写 `0x0100 = 0x01`（单向初始化；方向寄存器 0x0301 实测 = 0）之后，
    #    `0x0202` 由 0 走到 **1000**，肉眼确认**完全张开**、指示灯由红闪转**蓝常亮**。
    #    ⇒ **1000 = 全开** ⇒ true。这条有**实物目视背书**。
    #    （初始化前的 0x0202 读数是**无意义**的 —— 手册：未初始化时位置回读不作数。
    #      所以别拿「初始化前读到 0」去反推方向。）
    ag95_open_is_high: true
