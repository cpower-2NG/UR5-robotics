# ros2_control configuration for UR5 + AG-95（简化两指）in Gazebo Harmonic
#
# 单个 joint_trajectory_controller 管 6 个臂关节 + 1 个夹爪主关节；
# 右指不进控制器，由 URDF 的 <mimic> 交给物理引擎跟随（需 bullet-featherstone，见 launch）。

# ⚠ 死键（2026-11-06 实测）：插件节点的参数不走这个 yaml，
#   `ros2 param get` 也读不到；实际增益恒为 gz_ros2_control 代码默认 0.1。
#   position_proportional_gain: 10.0

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50  # Hz
    use_local_topics: false

joint_trajectory_controller:
  ros__parameters:
    # 只留 position：声明 velocity 会让 gz_ros2_control 走速度分支，重力下跟不住
    # （肩关节稳态差 0.068 rad ≈ 指尖低 3 cm，2026-11-06 实测）。
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      - ag95_left_finger_joint
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      shoulder_pan_joint:
        trajectory: 0.0
        goal: 0.0
      shoulder_lift_joint:
        trajectory: 0.0
        goal: 0.0
      elbow_joint:
        trajectory: 0.0
        goal: 0.0
      wrist_1_joint:
        trajectory: 0.0
        goal: 0.0
      wrist_2_joint:
        trajectory: 0.0
        goal: 0.0
      wrist_3_joint:
        trajectory: 0.0
        goal: 0.0
      ag95_left_finger_joint:
        trajectory: 0.0
        goal: 0.0
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
