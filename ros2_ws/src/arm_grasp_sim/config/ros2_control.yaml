# ros2_control configuration for UR5 + gripper in Gazebo Fortress
#
# Single joint_trajectory_controller manages all 7 joints (arm + gripper).

gz_ros2_control:
  ros__parameters:
    position_proportional_gain: 10.0

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50  # Hz
    use_local_topics: false

joint_trajectory_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      - robotiq_85_left_knuckle_joint
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      shoulder_pan_joint:
        trajectory: 0.0
        goal: 0.0
      shoulder_lift_joint:
        trajectory: 0.0
        goal: 0.0
      elbow_joint:
        trajectory: 0.0
        goal: 0.0
      wrist_1_joint:
        trajectory: 0.0
        goal: 0.0
      wrist_2_joint:
        trajectory: 0.0
        goal: 0.0
      wrist_3_joint:
        trajectory: 0.0
        goal: 0.0
      robotiq_85_left_knuckle_joint:
        trajectory: 0.0
        goal: 0.0
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
