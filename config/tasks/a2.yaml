# ⚠️ 这是**模板 / 起点**，不是可以现在拿去跑的任务。
#
# 它是**阶段 2（多类分拣）**的任务描述骨架：形状与 `a1.yaml` 完全一样，差别只在
# 任务特有的那几项。**阶段 2 的契约还没写**（`docs/阶段/阶段2-多类分拣/契约.md`），
# 所以这份文件里凡是需要契约才能定的值，都只能先抄阶段 1 的 —— 抄来的每一处都标了
# 「待契约确认」。**别在阶段 2 契约落地之前拿它上真机。**
#
# 这份文件同时示范**一件必须故意留着的事**：`score.callable` 指向的
# `board_a2:grade` **现在还不存在**。启动器遇到这种情况**必须大声报错**，
# 绝不许「判分跳过、报告全绿」 —— 判分器换个名字/搬个家，是很容易发生的，
# 而它的失效方式是「看起来一切正常」（`test_board_run.py` 钉着这一条）。

task: a2

launch:
  entry: yolo_bringup/bringup.launch.py
  camera_source: realsense

  # 与 a1 同一套理由：真机细分项靠 launch_configurations 直通给这两份，入口那份
  # 故意不声明它们（见 `a1.yaml` 里的长注释与 `bringup.launch.py` 文件头）。
  declared_entries:
    - yolo_bringup/bringup.launch.py
    - yolo_bringup/real.launch.py
    - yolo_bringup/pipeline.launch.py

  start_delay: 120        # 待契约确认：多类分拣要不要更长的按播放窗口
  trajectory_action: /scaled_joint_trajectory_controller/follow_joint_trajectory

  # 例：某一档本来就没有遥测/参数回读时，在**调用方**这一侧显式声明缺哪几项
  # （`board_gate --allow-skip` 的同名语义；controllers 不许出现在这里）。
  # allow_skip: [telemetry]

params:
  # 值一律写成**字符串**：launch 参数只有字符串一种形态。
  carry_objects: "true"
  gripper_backend: "ag95"
  use_target_plane: "true"
  target_plane_z: "0.0285"
  # 「抓取点取哪儿」——**这是 2026-10-08 修掉的那条系统偏差**。
  #   检测框框的是方块在图像上的**整个侧影**（顶面 + 朝向相机的竖面），不是顶面；
  #   斜视下侧影中心比顶面中心低 (S·sinα·f)/(2D) 像素，实测这帧是 6.4 px
  #   ≈ base 方向 13.7 mm —— 夹爪于是咬在顶面靠相机那一侧，方块才 28.5 mm 宽。
  #   top_face_center 用「远端上棱 ∩ 顶面」与「近端下棱 ∩ 台面」两点的中点把它
  #   修回来（不需要知道方块多大、相机多斜）。实测：正向模型 13.15 mm → <1 mm；
  #   真帧上抓取点投回图像 6.44 px → 0.97 px。要退回旧行为，把这一行删掉或改成
  #   "bbox_center"（节点默认就是 bbox_center，删掉即回到旧算法）。
  grasp_point_mode: "top_face_center"
  # 台面高度（base_link 系，米）。只被上面的 top_face_center 用到：近端下棱一定
  #   落在台面上。它必须 **小于** target_plane_z，写反了构造函数会当场喊。
  #   ⚠️ 台面实际不在 z=0 的话，误差约是这个偏置的一半 —— 与 target_plane_z 的
  #   口径要一起核对（那里假定 = 台面 + 方块高）。
  table_plane_z: "0.0"
  # 阶段 2 预期会多出来的：按类放置的策略/类别名映射之类。
  # 具体键名等契约定了再写 —— 现在编一个只会让「拼错不报错」更难查。

model: block_best.pt     # 待契约确认：多类要用多类权重，模型文件名会变

expect:
  slots_total: 4         # 待契约确认：现在抄的是阶段 1 的盘（4 槽）
  min_candidates: 4      # 待契约确认：多类同场时这个下限要重定
  finish_marker: "收工："
  timeout: 900
  params:
    carry_objects: "true"
    gripper_backend: "ag95"

score:
  # ⚠️ 这个模块**还不存在** —— 阶段 2 的判分本体属于阶段 2 的契约。
  #    现在跑 `--task a2` 的话，P0 能过（形状是合法的），但判分那一步会
  #    **报错**（CallableError），退 2；**不会**静默跳过判分。
  callable: "board_a2:grade"
  explain: "board_a2:explain"
